; ============================================================
; IoT Secure Asset Monitoring — Arduino Uno port (SKELETON)
; Author : Chlliboina Yaswanth
; ============================================================
;
; STATUS: structural skeleton. The application logic in src/main.cpp
; is complete and mirrors the STM32 firmware; the hardware bodies in
; the module .cpp files are marked // TODO.
;
; ⚠️ READ THIS BEFORE CHOOSING THIS BOARD
;
; The Uno is the weakest target in this repository, for two reasons
; that are not fixable in software:
;
;   1. 2 KB of SRAM. The STM32 firmware keeps a 256-byte log buffer
;      and a 300-byte AT-command buffer — 550 bytes, 27% of this
;      board's entire RAM, before the SPI, Wire and SoftwareSerial
;      libraries take their share. Every buffer here is deliberately
;      small and every string literal is wrapped in F() to keep it in
;      flash. See the SRAM budget in README.md.
;
;   2. No networking at all. There is no radio and no Ethernet MAC on
;      an ATmega328P. The `wifi` module therefore CANNOT work without
;      external hardware — an ESP-01 on SoftwareSerial or a W5500 on
;      the SPI bus. With neither fitted, wifi_send_log() returns false
;      and the system logs locally only. That is stated honestly in
;      src/wifi.cpp rather than papered over.
;
; If you have a choice, use the ESP32 port: on-chip Wi-Fi, 520 KB of
; SRAM, and none of the above applies.
;
; Why this is not a copy of the STM32 port:
;   - AVR has no HAL. Pin access is pinMode/digitalWrite.
;   - 5V logic. The RC522 is a 3.3V part and needs level shifting —
;     this is the ONLY port in the repo where that is true.
;   - µs delays come from delayMicroseconds(); the DHT11 bit loop must
;     run with interrupts off because millis() steals ~4 µs.
;   - Only two external interrupts (D2, D3) exist for the PIR.
;
; Build : pio run
; Upload: pio run --target upload
; ============================================================

[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

; Matches Serial.begin(9600) in src/main.cpp. The Uno's USB-serial
; bridge is shared with the bootloader, so this is the debug terminal.
monitor_speed = 9600

build_flags =
    -Wall
