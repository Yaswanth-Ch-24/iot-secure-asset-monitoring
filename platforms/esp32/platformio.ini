; ============================================================
; IoT Secure Asset Monitoring — ESP32 port (SKELETON)
; Author : Chlliboina Yaswanth
; ============================================================
;
; STATUS: structural skeleton. The application logic in src/main.cpp
; is complete and mirrors the STM32 firmware; the hardware bodies in
; the module .cpp files are marked // TODO.
;
; It compiles and runs — it will log through the USB serial port and
; the safe-state indicator writes are real — but no sensor returns
; live data until the TODOs are filled in.
;
; Why this is not a copy of the STM32 port:
;   - Wi-Fi is on-chip (WiFi.h + HTTPClient). There is no ESP8266 on
;     a UART and no AT-command layer at all.
;   - The DS1307 is optional: SNTP over the on-chip Wi-Fi plus the
;     ESP32's own RTC keeps time without external hardware.
;   - PIR uses attachInterrupt(), not HAL EXTI + NVIC.
;   - Micro-second delays come from delayMicroseconds(), not a TIM
;     counter, and are NOT interrupt-safe (see src/dht11.cpp).
;
; Build : pio run
; Upload: pio run --target upload
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -Wall
